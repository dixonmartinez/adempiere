plugins {
    id 'java'
    id 'war'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['base/src']
        }
    }
}

dependencies {
    // HikariCP (pool de conexiones) - descarga automática
    implementation 'com.zaxxer:HikariCP:5.0.1'
    // PostgreSQL driver
    implementation 'org.postgresql:postgresql:42.7.3'
    // MySQL / MariaDB driver
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.4.0'
    // ZK básico (dependencia del proyecto original)
    // JasperReports (dependencia del proyecto original)
    // Vavr (funcional, usado por algunas clases de ADempiere)
    implementation 'io.vavr:vavr:0.10.4'
    // Nota: AdempiereException es código interno (base/src), no un jar externo
}
